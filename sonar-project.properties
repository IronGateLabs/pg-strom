# SonarCloud Configuration for PG-Strom
# https://sonarcloud.io/project/overview?id=IronGateLabs_pg-strom

sonar.projectKey=IronGateLabs_pg-strom
sonar.organization=irongatelabs
sonar.projectName=pg-strom

# Source directories (active code only)
sonar.sources=src/,arrow-tools/

# Exclude noise: deprecated code, generated docs, vendored libs, test fixtures,
# symlink directories (src/dpu/ contains only symlinks), SQL DDL files
sonar.exclusions=deadcode/**,docs/**,src/flatbuffers/**,test/**,fluentd/**,man/**,src/dpu/**,src/sql/**

# Language file suffixes — map CUDA .cu files to C++ analyzer
sonar.c.file.suffixes=.c,.h
sonar.cpp.file.suffixes=.cpp,.hpp,.cc,.cxx,.cu

# Encoding
sonar.sourceEncoding=UTF-8

# Note: Exclusions, sources, and quality profiles are also configured via
# SonarCloud API to ensure automatic analysis picks them up correctly.
